<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="settingsTitle">MailState Sync settings</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
<main>
    <header class="pageHeader">
        <h1 data-i18n="extensionName">MailState Sync</h1>
        <p data-i18n="intro"></p>
    </header>

    <section class="settingsSection" aria-labelledby="accountsHeading">
        <h2 id="accountsHeading" data-i18n="accountsHeading">Synchronization</h2>
        <div class="sectionBody">
            <label class="checkRow"><input id="enabled" type="checkbox"><span data-i18n="enabledLabel">Enable synchronization</span></label>
            <label class="checkRow"><input id="watchEnabled" type="checkbox"><span data-i18n="watchLabel">Apply Dropbox changes automatically</span></label>
            <h3 data-i18n="accountListHeading">POP3 accounts</h3>
            <div id="accountList" class="accountList" aria-describedby="accountsHelp"></div>
            <p id="accountsHelp" class="note" data-i18n="accountsHelp"></p>
            <details id="folderSettings">
                <summary data-i18n="folderSettingsHeading">Limit folders</summary>
                <div class="detailsBody">
                    <label for="folderPrefixes" data-i18n="folderPrefixesLabel">Folder path prefixes</label>
                    <textarea id="folderPrefixes" rows="3" aria-describedby="prefixHelp" placeholder="/Inbox" spellcheck="false"></textarea>
                    <p id="prefixHelp" class="note" data-i18n="prefixHelp"></p>
                </div>
            </details>
        </div>
    </section>

    <section class="settingsSection" aria-labelledby="privacyHeading">
        <h2 id="privacyHeading" data-i18n="privacyHeading">Data sharing</h2>
        <div class="sectionBody">
            <p data-i18n="dataDisclosure"></p>
            <p class="note" data-i18n="dataExclusions"></p>
            <p><a href="privacy.html" target="_blank" rel="noopener" data-i18n="privacyLink">Privacy policy</a></p>
            <label class="checkRow"><input id="dataConsent" type="checkbox"><span data-i18n="consentLabel"></span></label>
        </div>
    </section>

    <section class="settingsSection" aria-labelledby="dropboxHeading">
        <h2 id="dropboxHeading" data-i18n="dropboxHeading">Dropbox</h2>
        <div class="sectionBody">
            <p id="authStatus" role="status" aria-live="polite"></p>
            <div class="actions"><button id="checkAuth" data-i18n="checkAuth">Refresh status</button><button id="disconnect" data-i18n="disconnect">Disconnect this device</button></div>
            <details id="connectionSettings" open>
                <summary data-i18n="connectionSettingsHeading">Connection setup</summary>
                <div class="detailsBody">
                    <p data-i18n="dropboxHelp"></p>
                    <ol class="setupSteps">
                        <li><a href="https://www.dropbox.com/developers/apps" target="_blank" rel="noopener noreferrer" data-i18n="dropboxConsole">Dropbox App Console</a><span data-i18n="dropboxStep1"></span></li>
                        <li data-i18n="dropboxStep2"></li>
                        <li data-i18n="dropboxStep3"></li>
                    </ol>
                    <label for="dropboxAppKey" data-i18n="appKeyLabel">App key</label>
                    <div class="inputAction"><input id="dropboxAppKey" type="text" autocomplete="off" spellcheck="false"><button id="openAuthPage" data-i18n="openAuth">Save and authorize</button></div>
                    <label for="dropboxAuthCode" data-i18n="authCodeLabel">Authorization code from Dropbox</label>
                    <div class="inputAction"><input id="dropboxAuthCode" type="password" autocomplete="off" spellcheck="false" aria-describedby="authCodeHelp"><button id="exchangeCode" data-i18n="connect">Connect</button></div>
                    <p id="authCodeHelp" class="note" data-i18n="authCodeHelp"></p>
                </div>
            </details>
            <p class="note" data-i18n="disconnectHelp"></p>
        </div>
    </section>

    <section class="settingsSection" aria-labelledby="operationsHeading">
        <h2 id="operationsHeading" data-i18n="operationsHeading">Manual sync</h2>
        <div class="sectionBody">
            <div class="actions"><button id="pullApply" data-i18n="pull">Apply Dropbox changes</button><button id="uploadNow" data-i18n="upload">Send saved changes</button></div>
            <p class="note" data-i18n="operationsHelp"></p>
            <details>
                <summary data-i18n="fullScanHeading">First sync or rescan</summary>
                <div class="detailsBody">
                    <p data-i18n="fullScanHelp"></p>
                    <button id="fullScanLocal" data-i18n="fullScan">Scan this PC and upload</button>
                </div>
            </details>
        </div>
    </section>

    <section class="settingsSection" aria-labelledby="optionalHeading">
        <h2 id="optionalHeading" data-i18n="optionalHeading">Advanced</h2>
        <div class="sectionBody">
            <details id="optionalSettings">
                <summary data-i18n="optionalSettingsHeading">JSON export and folder cleanup</summary>
                <div class="detailsBody">
                    <label class="checkRow"><input id="localMirrorEnabled" type="checkbox" aria-describedby="mirrorHelp"><span data-i18n="mirrorLabel"></span></label>
                    <p id="mirrorHelp" class="note" data-i18n="mirrorHelp"></p>
                    <label for="localMirrorFilename" data-i18n="mirrorPathLabel">Path relative to Downloads</label>
                    <input id="localMirrorFilename" type="text" spellcheck="false">
                    <label class="checkRow"><input id="cleanupEmptyFolders" type="checkbox" aria-describedby="cleanupHelp"><span data-i18n="cleanupLabel"></span></label>
                    <p id="cleanupHelp" class="note" data-i18n="cleanupHelp"></p>
                </div>
            </details>
            <details>
                <summary data-i18n="removalHeading">Reset this add-on</summary>
                <div class="detailsBody">
                    <p data-i18n="removalHelp"></p>
                    <button id="clearLocalData" class="danger" data-i18n="clearLocal">Delete settings and local sync data</button>
                </div>
            </details>
        </div>
    </section>

    <footer class="saveBar">
        <div class="actions"><button id="save" class="primary" data-i18n="save">Save settings</button><button id="refresh" data-i18n="refresh">Reload settings</button></div>
        <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    </footer>
</main>
<script src="settings.js"></script>
<script src="i18n.js"></script>
<script src="options.js"></script>
</body>
</html>
