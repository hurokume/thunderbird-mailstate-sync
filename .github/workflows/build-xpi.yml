name: Build XPI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Build and verify XPI
        shell: pwsh
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mailstate-sync-${{ github.sha }}
          path: |
            dist/*.xpi
            dist/*-source.zip
            dist/*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
